[package]
name = "gn-shield-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gn-shield-sensors-common = { path = "../gn-shield-sensors-common" }
gn-shield-sensors-linux = { path = "../gn-shield-sensors-linux" }
gn-shield-config = { path = "../gn-shield-config" }
gn-shield-storage = { path = "../gn-shield-storage" }
gn-shield-rules = { path = "../gn-shield-rules" }
gn-shield-dns = { path = "../gn-shield-dns" }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
hickory-proto = "0.25"
gn-shield-native-host = { path = "../gn-shield-native-host" }

